name: Flutter CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Lint, Analyze and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-and-release:
    name: Build Signed Artifacts and Create Release
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ১. Secrets থেকে Keystore ডিকোড করে সরাসরি android/ ফোল্ডারে রাখা
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      # ২. Secrets থেকে ভার্চুয়াল মেশিনে একটি key.properties ফাইল তৈরি করা
      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      # ৩. Signed APK বিল্ড (কোনো অতিরিক্ত env ভ্যারিয়েবল লাগবে না)
      - name: Build Signed APK
        run: flutter build apk --release --no-tree-shake-icons

      # ৪. Signed AAB বিল্ড
      - name: Build Signed App Bundle
        run: flutter build appbundle --release --no-tree-shake-icons

      # ৫. GitHub Release তৈরি ও ফাইল আপলোড
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      # ৬. Firebase App Distribution-এ APK আপলোড
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-App-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: qa-team
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Automated QA test build from CI/CD"
